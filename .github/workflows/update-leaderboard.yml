name: Update Leaderboard

# DISABLED: Leaderboard now fetches directly from blockchain in real-time
# This workflow is kept for reference but not actively used
# To re-enable: uncomment the 'on' section below

# on:
#   schedule:
#     # Run every 10 minutes
#     - cron: '*/10 * * * *'
#   workflow_dispatch: # Allow manual trigger

on:
  workflow_dispatch: # Manual trigger only (disabled by default)

permissions:
  contents: write # Allow workflow to commit and push changes

jobs:
  update-leaderboard:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Fetch leaderboard from blockchain
        run: npm run leaderboard:fetch:mainnet
      
      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet public/leaderboard.json || echo "changed=true" >> $GITHUB_OUTPUT
      
      - name: Commit and push if changed
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/leaderboard.json leaderboard-cache.json
          git commit -m "chore: Update leaderboard [skip ci]"
          git push
